name: ASP.NET (Blazor Server) CI

on:
  push:
    branches: [ "main" ]
    paths:
      - ".NET ASP/**"
      - ".github/workflows/dotnet-asp.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".NET ASP/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # runner 환경 고정 (windows-latest 변동 이슈 회피)

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET (8.0)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore "./.NET ASP/AspNetBlazorServer/AspNetBlazorServer.sln"

    - name: Build (Release)
      run: dotnet build "./.NET ASP/AspNetBlazorServer/AspNetBlazorServer.sln" --configuration Release --no-restore

     
    - name: Test (if any)
      shell: pwsh
      run: |
        $tests = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.Name -match '\.Tests?\.csproj$' }
        if ($tests) {
          foreach ($p in $tests) {
            dotnet test $p.FullName --configuration Release --no-build --verbosity normal
          }
        } else {
          Write-Host "No test projects found – skipping."
        }
